# Independent primary and replicas. Only explicitly public sources replicate.
# Each replica has its own accounts, UI secret, upstream credentials and cache.
# Replicas have egress for their node-local Docker/Helm sources.
# See docs/ISOLATION.md before upgrading an existing data volume.

name: ociproxy

x-node-env: &node-env
  # Local primary/UI administration secret. Replicas override this value.
  OCIPROXY_SECRET: ${OCIPROXY_SECRET:?set OCIPROXY_SECRET in .env (openssl rand -hex 32)}
  # Local bootstrap admin. Each replica overrides the password. Create day-to-day
  # users with `ociproxy user add` or in the web UI.
  OCIPROXY_PUSH_USERNAME: ${PUSH_USERNAME:-ci}
  OCIPROXY_PUSH_PASSWORD: ${PUSH_PASSWORD:?set PUSH_PASSWORD in .env}
  # Visibility of repos no [access] rule / upstream / helm entry sets:
  # "public" (anonymous pulls) or "private" (signed-in users only).
  # Each node enforces its own visibility and accounts.
  # (Older .env files: PULL_AUTH=none|basic still works when this is unset.)
  OCIPROXY_DEFAULT_VISIBILITY: ${DEFAULT_VISIBILITY:-}
  OCIPROXY_PULL_AUTH: ${PULL_AUTH:-none}
  # Seconds a cached tag is served before it is revalidated upstream.
  OCIPROXY_TAG_TTL: ${TAG_TTL:-300}
  # Expire mirrored images not pulled for N days (0 = keep forever).
  OCIPROXY_GC_MANIFEST_MAX_IDLE_DAYS: ${GC_MANIFEST_MAX_IDLE_DAYS:-0}
  OCIPROXY_GC_INTERVAL: ${GC_INTERVAL:-3600}
  OCIPROXY_GC_BLOB_GRACE: ${GC_BLOB_GRACE:-86400}
  OCIPROXY_GC_DISK_HIGH_PERCENT: ${GC_DISK_HIGH_PERCENT:-0}
  OCIPROXY_GC_DISK_LOW_PERCENT: ${GC_DISK_LOW_PERCENT:-75}
  OCIPROXY_GC_MAX_CACHE_BYTES: ${GC_MAX_CACHE_BYTES:-0}
  OCIPROXY_LOG_FORMAT: ${LOG_FORMAT:-text}

x-node: &node
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: ociproxy:latest
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    # ProxyHandler({}) so a proxy in the env cannot break local healthchecks.
    test: ["CMD", "/usr/bin/python3", "-c",
           "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:5000/v2/', timeout=5)"]
    interval: 10s
    timeout: 10s
    retries: 6
    start_period: 5s

x-replica: &replica
  <<: *node
  depends_on:
    primary:
      condition: service_healthy
  networks: [replication, egress]

services:
  primary:
    <<: *node
    environment:
      <<: *node-env
      OCIPROXY_ROLE: primary
      OCIPROXY_REPLICATION_PEERS: >-
        {"replica1":{"token":"${REPLICA1_REPLICATION_TOKEN:?set a unique replica1 replication token}","publish":true},"replica2":{"token":"${REPLICA2_REPLICATION_TOKEN:?set a unique replica2 replication token}","publish":true}}
      OCIPROXY_ADVERTISED_URL: http://primary:5000
      # Proxy for upstream registry / Helm repo fetches only (e.g. a squid at
      # http://proxy.corp:3128). Node-to-node traffic is never proxied.
      OCIPROXY_UPSTREAM_PROXY: ${UPSTREAM_PROXY:-}
      # Alternatively the standard variables (also only used for upstreams):
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    networks: [replication, egress]
    ports:
      - "${PRIMARY_PORT:-5000}:5000"
    volumes:
      - ./ociproxy.toml:/app/ociproxy.toml:ro
      - primary-data:/var/lib/ociproxy

  replica1:
    <<: *replica
    environment:
      <<: *node-env
      OCIPROXY_ROLE: replica
      OCIPROXY_PRIMARY_URL: http://primary:5000
      # Node address for the public replication status display.
      OCIPROXY_ADVERTISED_URL: http://replica1:5000
      OCIPROXY_SECRET: ${REPLICA1_SECRET:?set an independent replica1 local secret}
      OCIPROXY_PUSH_PASSWORD: ${REPLICA1_PUSH_PASSWORD:?set replica1 bootstrap password}
      OCIPROXY_REPLICATION_ID: replica1
      OCIPROXY_REPLICATION_TOKEN: ${REPLICA1_REPLICATION_TOKEN:?set replica1 replication token}
    ports:
      - "${REPLICA1_PORT:-5001}:5000"
    volumes:
      - ${REPLICA1_CONFIG:-./ociproxy.replica.toml.example}:/app/ociproxy.toml:ro
      - replica1-data:/var/lib/ociproxy

  replica2:
    <<: *replica
    environment:
      <<: *node-env
      OCIPROXY_ROLE: replica
      OCIPROXY_PRIMARY_URL: http://primary:5000
      OCIPROXY_ADVERTISED_URL: http://replica2:5000
      OCIPROXY_SECRET: ${REPLICA2_SECRET:?set an independent replica2 local secret}
      OCIPROXY_PUSH_PASSWORD: ${REPLICA2_PUSH_PASSWORD:?set replica2 bootstrap password}
      OCIPROXY_REPLICATION_ID: replica2
      OCIPROXY_REPLICATION_TOKEN: ${REPLICA2_REPLICATION_TOKEN:?set replica2 replication token}
    ports:
      - "${REPLICA2_PORT:-5002}:5000"
    volumes:
      - ${REPLICA2_CONFIG:-./ociproxy.replica.toml.example}:/app/ociproxy.toml:ro
      - replica2-data:/var/lib/ociproxy

  ui: &ui
    build:
      context: ./webapp
      dockerfile: ../docker/Dockerfile.ui
    image: ociproxy-ui:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      primary:
        condition: service_healthy
    environment:
      OCIPROXY_URL: http://primary:5000
      # The UI adds this header on internal calls; the browser never sees it.
      # It also keys the UI's session cookies.
      OCIPROXY_SECRET: ${OCIPROXY_SECRET:?set OCIPROXY_SECRET in .env}
      # How browsers reach the UI. Required for single sign-on; https here
      # also marks session cookies Secure.
      UI_PUBLIC_URL: ${UI_PUBLIC_URL:-}
      # Optional single sign-on (e.g. Authentik). Empty OIDC_ISSUER = off.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_PUSHER_GROUP: ${OIDC_PUSHER_GROUP:-}
      OIDC_READER_GROUP: ${OIDC_READER_GROUP:-}
    # egress: reaching the OIDC issuer. Drop it if single sign-on is off.
    networks: [replication, egress]
    ports:
      - "${UI_PORT:-8080}:8080"

  # More replicas: copy a replicaN block with its own advertised URL, port
  # and volume.

  ui1:
    <<: *ui
    depends_on:
      replica1:
        condition: service_healthy
    environment:
      OCIPROXY_URL: http://replica1:5000
      OCIPROXY_SECRET: ${REPLICA1_SECRET:?set replica1 local secret}
      UI_PUBLIC_URL: ${REPLICA1_UI_PUBLIC_URL:-}
    ports:
      - "${REPLICA1_UI_PORT:-8081}:8080"

  ui2:
    <<: *ui
    depends_on:
      replica2:
        condition: service_healthy
    environment:
      OCIPROXY_URL: http://replica2:5000
      OCIPROXY_SECRET: ${REPLICA2_SECRET:?set replica2 local secret}
      UI_PUBLIC_URL: ${REPLICA2_UI_PUBLIC_URL:-}
    ports:
      - "${REPLICA2_UI_PORT:-8082}:8080"

networks:
  replication:
    internal: true
  egress: {}

volumes:
  primary-data:
  replica1-data:
  replica2-data:
