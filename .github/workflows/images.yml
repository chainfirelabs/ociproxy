name: Build container images

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to publish (blank builds the selected ref only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Verify license inventories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Check project and dependency notices
        run: python3 tools/check_licenses.py

  images:
    name: Build ${{ matrix.image }}
    needs: licenses
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: proxy
            dockerfile: docker/Dockerfile
            context: .
          - image: ui
            dockerfile: docker/Dockerfile.ui
            context: webapp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          image="ociproxy-ci/${IMAGE}:${GITHUB_SHA}"
          if [ "$PUBLISH" = "true" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo 'Git tag is not a valid container image tag.' >&2
              exit 1
            fi
            repository="${GITHUB_REPOSITORY,,}"
            image="ghcr.io/${repository}:${RELEASE_TAG}"
            if [ "$IMAGE" = "ui" ]; then
              image="ghcr.io/${repository}/ui:${RELEASE_TAG}"
            fi
          fi
          revision="$(git rev-parse HEAD)"
          docker build \
            --pull \
            --provenance=false \
            --file "$DOCKERFILE" \
            --tag "$image" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${revision}" \
            "$BUILD_CONTEXT"
          if [ "$PUBLISH" = "true" ]; then
            docker push "$image"
          fi
