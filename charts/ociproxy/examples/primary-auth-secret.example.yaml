# Replace every placeholder before applying. Keep completed files private.
# Change the namespace if your primary is installed elsewhere.
apiVersion: v1
kind: Secret
metadata:
  name: ociproxy-auth
  namespace: ociproxy-primary
type: Opaque
stringData:
  # Local to the primary and its UI; never copy this value to a replica.
  secret: "REPLACE_WITH_UNIQUE_PRIMARY_ADMIN_SECRET"
  push-password: "REPLACE_WITH_UNIQUE_PRIMARY_BOOTSTRAP_PASSWORD"
  # site-a must match the replica's replication.id Helm value.
  # The token must match that replica's replication-token below.
  # publish: true permits this replica to publish anonymous public sources.
  replication-peers: |
    {
      "site-a": {
        "token": "REPLACE_WITH_UNIQUE_SITE_A_REPLICATION_TOKEN",
        "publish": true
      }
    }
