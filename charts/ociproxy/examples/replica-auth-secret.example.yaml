# Replace every placeholder before applying. Keep completed files private.
apiVersion: v1
kind: Secret
metadata:
  name: ociproxy-auth
  namespace: ociproxy-replica
type: Opaque
stringData:
  # Local to this replica and its UI; different from the primary's secret.
  secret: "REPLACE_WITH_UNIQUE_REPLICA_ADMIN_SECRET"
  push-password: "REPLACE_WITH_UNIQUE_REPLICA_BOOTSTRAP_PASSWORD"
  # Required by the chart on replicas; no inbound peer allowlist is used.
  replication-peers: "{}"
  # Must match the site-a token in the primary's replication-peers mapping.
  replication-token: "REPLACE_WITH_UNIQUE_SITE_A_REPLICATION_TOKEN"
