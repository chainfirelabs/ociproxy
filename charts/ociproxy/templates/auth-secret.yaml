{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ociproxy.secretName" . }}
  labels:
    {{- include "ociproxy.labels" . | nindent 4 }}
  annotations:
    # Keep this node's independent administration and replication credentials.
    helm.sh/resource-policy: keep
type: Opaque
data:
  replication-peers: {{ .Values.replication.peers | toJson | b64enc | quote }}
  replication-token: {{ include "ociproxy.persistedValue" (dict "root" . "key" "replication-token" "value" .Values.replication.token) | b64enc | quote }}
  secret: {{ include "ociproxy.persistedValue" (dict "root" . "key" "secret" "value" .Values.auth.secret) | b64enc | quote }}
  push-password: {{ include "ociproxy.persistedValue" (dict "root" . "key" "push-password" "value" .Values.auth.pushPassword) | b64enc | quote }}
  {{- with .Values.primary.upstreamProxy }}
  upstream-proxy: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.ui.oidc.clientSecret }}
  oidc-client-secret: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
