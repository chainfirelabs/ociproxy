{{- range $component := list "primary" "replica" "ui" }}
{{- $ing := index $.Values.ingress $component }}
{{- /* Registries expose only client and replication routes, never /internal/ or /metrics. */}}
{{- $defaultPaths := list "/" }}
{{- if eq $component "primary" }}{{ $defaultPaths = list "/v2/" "/helm/" "/replication/" }}{{ end }}
{{- if eq $component "replica" }}{{ $defaultPaths = list "/v2/" "/helm/" }}{{ end }}
{{- if and $ing.enabled (index $.Values $component).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ociproxy.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ociproxy.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required (printf "ingress.%s.host is required" $component) $ing.host | quote }}
      http:
        paths:
          {{- range ($ing.paths | default $defaultPaths) }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "ociproxy.fullname" $ }}-{{ $component }}
                port:
                  name: http
          {{- end }}
{{- end }}
{{- end }}
