{{- /* Stable per-pod DNS for both StatefulSets: the primary pushes to
replica pods by name. Not-ready pods are published so a starting replica is
reachable as soon as it registers. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "containerproxy.headless" . }}
  labels:
    {{- include "containerproxy.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "containerproxy.selectorLabels" . | nindent 4 }}
    containerproxy.io/node: "true"
  ports:
    - name: http
      port: 5000
      targetPort: http
{{- range $component := list "primary" "replica" }}
{{- $c := index $.Values $component }}
{{- if $c.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "containerproxy.fullname" $ }}-{{ $component }}
  labels:
    {{- include "containerproxy.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "containerproxy.componentSelector" (dict "root" $ "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      {{- if and $c.service.nodePort (has $c.service.type (list "NodePort" "LoadBalancer")) }}
      nodePort: {{ $c.service.nodePort }}
      {{- end }}
{{- end }}
{{- end }}
{{- if .Values.ui.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "containerproxy.fullname" . }}-ui
  labels:
    {{- include "containerproxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.ui.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "containerproxy.componentSelector" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- end }}
