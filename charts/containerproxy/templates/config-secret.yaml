{{- /*
containerproxy.toml for every node. A Secret, not a ConfigMap: upstream and
Helm repo entries may carry credentials. Values are rendered with toJson,
whose strings are valid TOML basic strings. Upstreams and Helm repos are only
rendered when this release has the primary: replicas use the primary's list.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "containerproxy.configSecretName" . }}
  labels:
    {{- include "containerproxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  containerproxy.toml: |
    # Rendered by the containerproxy Helm chart.
    {{- with .Values.config.accessRules }}
    [access]
    {{- range . }}

    [[access.rule]]
    path = {{ required "config.accessRules[].path is required" .path | toJson }}
    visibility = {{ required "config.accessRules[].visibility is required" .visibility | toJson }}
    {{- end }}
    {{- end }}
    {{- range .Values.config.upstreams }}

    [[upstream]]
    {{- range $k, $v := . }}
    {{ $k }} = {{ $v | toJson }}
    {{- end }}
    {{- end }}
    {{- range .Values.config.helmRepos }}

    [[helm]]
    {{- range $k, $v := . }}
    {{ $k }} = {{ $v | toJson }}
    {{- end }}
    {{- end }}
