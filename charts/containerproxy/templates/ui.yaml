{{- if .Values.ui.enabled }}
{{- $ui := .Values.ui }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "containerproxy.fullname" . }}-ui
  labels:
    {{- include "containerproxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  # Stateless; sessions are signed cookies keyed by the node secret.
  replicas: 1
  selector:
    matchLabels:
      {{- include "containerproxy.componentSelector" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "containerproxy.componentSelector" (dict "root" . "component" "ui") | nindent 8 }}
      annotations:
        {{- if not .Values.auth.existingSecret }}
        checksum/auth: {{ .Values.auth | toJson | sha256sum }}
        {{- end }}
        {{- with $ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "containerproxy.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ printf "%s:%s" $ui.image.repository ($ui.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ $ui.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CONTAINERPROXY_URL
              {{- if $ui.nodeUrl }}
              value: {{ $ui.nodeUrl | quote }}
              {{- else if .Values.replica.enabled }}
              value: {{ printf "http://%s-replica.%s.svc.%s:%v" (include "containerproxy.fullname" .) .Release.Namespace .Values.clusterDomain .Values.replica.service.port | quote }}
              {{- else }}
              value: {{ include "containerproxy.primaryServiceUrl" . | quote }}
              {{- end }}
            - name: CONTAINERPROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "containerproxy.secretName" . }}
                  key: secret
            - name: UI_SESSION_HOURS
              value: {{ $ui.sessionHours | quote }}
            {{- if $ui.nodeUrl }}
            - name: UI_NODE_URL
              value: {{ $ui.nodeUrl | quote }}
            {{- else if and (not .Values.primary.enabled) .Values.replica.enabled }}
            - name: UI_NODE_URL
              value: {{ printf "http://%s-replica.%s.svc.%s:%v" (include "containerproxy.fullname" .) .Release.Namespace .Values.clusterDomain .Values.replica.service.port | quote }}
            {{- end }}
            {{- with $ui.publicUrl }}
            - name: UI_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if $ui.oidc.issuer }}
            - name: OIDC_ISSUER
              value: {{ $ui.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "ui.oidc.clientId is required with ui.oidc.issuer" $ui.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $ui.oidc.existingSecret | default (include "containerproxy.secretName" .) }}
                  key: oidc-client-secret
            {{- range $name, $value := dict "OIDC_PROVIDER_NAME" $ui.oidc.providerName "OIDC_ADMIN_GROUP" $ui.oidc.adminGroup "OIDC_PUSHER_GROUP" $ui.oidc.pusherGroup "OIDC_READER_GROUP" $ui.oidc.readerGroup }}
            {{- if $value }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with $ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
