{{- if and .Values.replica.enabled .Values.replica.podDisruptionBudget.enabled (gt (int .Values.replica.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "containerproxy.fullname" . }}-replica
  labels:
    {{- include "containerproxy.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.replica.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "containerproxy.componentSelector" (dict "root" . "component" "replica") | nindent 6 }}
{{- end }}
